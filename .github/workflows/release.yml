name: Android Release

on:
  push:
    branches: [main]
    paths:
      - version.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing identity
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.FN_MUSIC_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.FN_MUSIC_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_PASSWORD"
          keystore="$RUNNER_TEMP/fn-music-tv-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - name: Run release quality gates and build universal APK
        env:
          FN_MUSIC_RELEASE_PASSWORD: ${{ secrets.FN_MUSIC_RELEASE_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PfnMusicReleaseStoreFile="${{ steps.signing.outputs.keystore }}" \
            :core:model:test \
            :core:data:testDebugUnitTest \
            :core:playback:testDebugUnitTest \
            :app:testSideloadDebugUnitTest \
            :core:data:lintRelease \
            :core:playback:lintRelease \
            :app:lintSideloadRelease \
            :app:assembleSideloadDebugAndroidTest \
            :app:assembleSideloadRelease

      - name: Verify and stage universal APK
        id: artifact
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/sideload/release/fn-music-tv-$VERSION_NAME-sideload-release.apk"
          test -f "$source_apk"

          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          badging="$("$aapt" dump badging "$source_apk")"
          grep -F "package: name='com.fnmusic.tv' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$badging"
          grep -F "sdkVersion:'23'" <<< "$badging"
          grep -F "targetSdkVersion:'36'" <<< "$badging"
          grep -F "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86' 'x86_64'" <<< "$badging"
          "$apksigner" verify --verbose --print-certs "$source_apk"

          mkdir -p dist
          release_apk="dist/fn-music-tv-$VERSION_NAME-universal.apk"
          cp "$source_apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          echo "apk=$release_apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$release_apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_APK: ${{ steps.artifact.outputs.apk }}
          RELEASE_CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK#Android 6.0+ universal APK" \
            "$RELEASE_CHECKSUM#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "回声台 $VERSION_NAME" \
            --generate-notes
