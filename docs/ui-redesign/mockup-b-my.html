<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设计稿 B · 侧栏导航</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #101214; overflow: hidden; }
  body { font-family: -apple-system, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; color: #F4F2EC; -webkit-font-smoothing: antialiased; }
  .screen { width: 1920px; height: 1080px; display: flex; }

  /* 左侧导航栏 */
  .rail { width: 420px; height: 1080px; flex: none; background: #121619; border-right: 1px solid #23282B; display: flex; flex-direction: column; padding: 76px 32px 56px; }
  .brand { display: flex; align-items: center; gap: 18px; padding: 0 16px; }
  .logo { width: 64px; height: 64px; border-radius: 18px; background: #FF7657; display: flex; align-items: center; justify-content: center; color: #101214; font-size: 34px; font-weight: 800; }
  .brand-name { font-size: 52px; font-weight: 700; }
  .nav { margin-top: 56px; display: flex; flex-direction: column; gap: 12px; }
  .nav-item { height: 88px; display: flex; align-items: center; gap: 20px; padding: 0 28px; border-radius: 22px; font-size: 40px; line-height: 1; }
  .nav-item svg { width: 34px; height: 34px; flex: none; }
  .nav-on { background: #FF7657; color: #101214; font-weight: 600; }
  .nav-off { color: #A9ADB4; }
  .spacer { flex: 1; }
  .divider { height: 1px; background: #23282B; margin: 24px 12px; }
  .rail-action { height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-radius: 18px; font-size: 32px; line-height: 1; color: #A9ADB4; }
  .rail-action svg { width: 28px; height: 28px; flex: none; }
  .rail-focus { color: #FF7657; }

  /* 内容区 */
  .content { flex: 1; min-width: 0; padding: 76px 128px 0; display: flex; flex-direction: column; }
  .topbar { display: flex; justify-content: space-between; align-items: center; height: 128px; flex: none; }
  .pill { width: 372px; height: 84px; border-radius: 999px; background: #232827; border: 1px solid #454C49; display: flex; align-items: center; padding: 10px 18px 10px 10px; }
  .pill-cover { width: 54px; height: 54px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #FF7657, #55C5A5); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #101214; }
  .pill-text { flex: 1; min-width: 0; margin: 0 12px; display: flex; flex-direction: column; gap: 3px; }
  .pill-status { display: flex; align-items: center; gap: 7px; font-size: 18px; color: #B7BBB7; line-height: 1; }
  .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: #55C5A5; }
  .pill-track { display: flex; align-items: baseline; gap: 9px; }
  .pill-title { font-size: 24px; font-weight: 700; color: #F4F2EC; }
  .pill-artist { font-size: 18px; color: #A7ABA7; }
  .pill-chevron { font-size: 34px; color: #C6C9C5; line-height: 1; }

  .page-title { font-size: 64px; font-weight: 700; margin: 0 0 12px; flex: none; }

  .strip { height: 96px; flex: none; background: #171A1E; border: 1px solid #262C30; border-radius: 22px; display: flex; align-items: center; padding: 0 26px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #FF7657, #55C5A5); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #101214; }
  .idcol { margin-left: 22px; display: flex; flex-direction: column; gap: 7px; }
  .uname { font-size: 36px; font-weight: 600; line-height: 1; }
  .chip { display: inline-flex; align-items: center; gap: 9px; padding: 5px 16px; border: 1px solid #2E3538; border-radius: 999px; background: #14181B; color: #A9ADB4; font-size: 24px; line-height: 1; width: fit-content; }
  .chip svg { width: 20px; height: 20px; }

  .band { flex: none; margin-top: 14px; }
  .band-title { font-size: 46px; font-weight: 600; }
  .band-row { display: flex; justify-content: space-between; margin-top: 10px; }
  .artist { width: 200px; }
  .artist-ava { width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 700; color: rgba(255,255,255,.95); }
  .artist-name { font-size: 30px; line-height: 1.25; margin-top: 12px; }
  .artist-count { font-size: 26px; color: #A9ADB4; margin-top: 6px; }
  .g1 { background: linear-gradient(135deg, #5A3FA8, #8A6BD6); }
  .g2 { background: linear-gradient(135deg, #1E5A50, #3E8C7C); }
  .g3 { background: linear-gradient(135deg, #8C2F3A, #C05555); }
  .g4 { background: linear-gradient(135deg, #8A5A1E, #C08A3E); }
  .g5 { background: linear-gradient(135deg, #A83A6B, #D06A9A); }
  .ava-focused { box-shadow: 0 0 0 4px #FF7657; }
  .name-focused { color: #FF7657; }

  .album { width: 200px; }
  .album-cover { width: 150px; height: 150px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700; color: rgba(255,255,255,.95); }
  .album-name { font-size: 32px; line-height: 1.2; margin-top: 10px; }
  .album-artist { font-size: 26px; color: #A9ADB4; margin-top: 4px; }
  .a1 { background: linear-gradient(135deg, #2E3A4C, #46597A); }
  .a2 { background: linear-gradient(135deg, #6B3144, #96506A); }
  .a3 { background: linear-gradient(135deg, #6E4E1E, #A87A2E); }
  .a4 { background: linear-gradient(135deg, #1E4632, #3A6E4C); }
  .a5 { background: linear-gradient(135deg, #2A2A5E, #4C4C8E); }
</style>
</head>
<body>
<div class="screen">
  <div class="rail">
    <div class="brand">
      <div class="logo">♪</div>
      <div class="brand-name">回声台</div>
    </div>
    <div class="nav">
      <div class="nav-item nav-off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </div>
      <div class="nav-item nav-on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="divider"></div>
    <div class="rail-action rail-focus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </div>
    <div class="rail-action">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>切换账号</span>
    </div>
  </div>

  <div class="content">
    <div class="topbar">
      <div class="pill">
        <div class="pill-cover">K</div>
        <div class="pill-text">
          <div class="pill-status"><span class="pill-dot"></span>正在播放</div>
          <div class="pill-track"><span class="pill-title">Kronos</span><span class="pill-artist">Sakuzyo</span></div>
        </div>
        <div class="pill-chevron">›</div>
      </div>
    </div>

    <h1 class="page-title">我的音乐</h1>

    <div class="strip">
      <div class="avatar">t</div>
      <div class="idcol">
        <div class="uname">test</div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          <span>nas</span>
        </div>
      </div>
    </div>

    <div class="band">
      <div class="band-title">歌手</div>
      <div class="band-row">
        <div class="artist">
          <div class="artist-ava g1 ava-focused">N</div>
          <div class="artist-name name-focused">Neuro-sama</div>
          <div class="artist-count">9 首歌曲</div>
        </div>
        <div class="artist">
          <div class="artist-ava g2">鏡</div>
          <div class="artist-name">鏡</div>
          <div class="artist-count">8 首歌曲</div>
        </div>
        <div class="artist">
          <div class="artist-ava g3">S</div>
          <div class="artist-name">SawanoHiroyuki[nZk]</div>
          <div class="artist-count">7 首歌曲</div>
        </div>
        <div class="artist">
          <div class="artist-ava g4">泽</div>
          <div class="artist-name">泽野弘之</div>
          <div class="artist-count">7 首歌曲</div>
        </div>
        <div class="artist">
          <div class="artist-ava g5">M</div>
          <div class="artist-name">MYTH &amp; ROID</div>
          <div class="artist-count">6 首歌曲</div>
        </div>
      </div>
    </div>

    <div class="band">
      <div class="band-title">专辑</div>
      <div class="band-row">
        <div class="album">
          <div class="album-cover a1">待</div>
          <div class="album-name">等待</div>
          <div class="album-artist">黄龄</div>
        </div>
        <div class="album">
          <div class="album-cover a2">免</div>
          <div class="album-name">免我蹉跎苦</div>
          <div class="album-artist">黄龄</div>
        </div>
        <div class="album">
          <div class="album-cover a3">花</div>
          <div class="album-name">花亦山心之月</div>
          <div class="album-artist">群星</div>
        </div>
        <div class="album">
          <div class="album-cover a4">浩</div>
          <div class="album-name">浩气如虹</div>
          <div class="album-artist">音阙诗听</div>
        </div>
        <div class="album">
          <div class="album-cover a5">清</div>
          <div class="album-name">清明</div>
          <div class="album-artist">音阙诗听</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
